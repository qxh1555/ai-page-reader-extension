<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Chat</title>
    <style>
      .markdown-body { font-size: 13px; line-height: 1.6; word-break: break-word; }
      .markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4 { margin: 12px 0 4px; font-weight: 600; }
      .markdown-body h1 { font-size: 1.2em; }
      .markdown-body h2 { font-size: 1.1em; }
      .markdown-body h3 { font-size: 1.05em; }
      .markdown-body p { margin: 4px 0; }
      .markdown-body ul,.markdown-body ol { padding-left: 18px; margin: 4px 0; }
      .markdown-body li { margin: 2px 0; }
      .markdown-body code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 0.9em; font-family: "SF Mono",Menlo,monospace; }
      .markdown-body pre { background: #f5f5f5; padding: 8px 12px; border-radius: 4px; overflow-x: auto; margin: 6px 0; }
      .markdown-body pre code { background: none; padding: 0; }
      .markdown-body blockquote { border-left: 3px solid #1976d2; padding-left: 10px; color: #666; margin: 6px 0; }
      .markdown-body table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 12px; }
      .markdown-body th,.markdown-body td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
      .markdown-body th { background: #f5f5f5; font-weight: 600; }
      .markdown-body a { color: #1976d2; }
      .markdown-body hr { border: none; border-top: 1px solid #eee; margin: 12px 0; }
      .markdown-body strong { font-weight: 600; }
      .markdown-body img { max-width: 100%; border-radius: 4px; }
    </style>
    <script type="module" crossorigin src="/sidepanel.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
